<!-- Fonte padrão do sistema: Nunito (mesma do app, ver src/app/layout.tsx).
     O Storybook não executa o layout do Next, então carregamos a Nunito aqui e
     definimos a variável --font-nunito que o `font-sans` (tailwind.config.ts)
     consome. Assim os componentes renderizam com a tipografia real. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-nunito: 'Nunito', system-ui, -apple-system, sans-serif;
  }
</style>
